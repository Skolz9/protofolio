<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <radialGradient id="tajineBg" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#221A13" stop-opacity="0.7" />
      <stop offset="55%" stop-color="#0E1015" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#07080A" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A668" />
      <stop offset="50%" stop-color="#DFC28B" />
      <stop offset="100%" stop-color="#B89352" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="38%" cy="92%" r="25%">
      <stop offset="0%" stop-color="#C8A668" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C8A668" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1440" height="800" fill="#08090C" />

  <!-- Subtle Overhead Moroccan Tajine Platter Backdrop -->
  <g opacity="0.28" transform="translate(720, 430)">
    <circle cx="0" cy="0" r="490" fill="#141821" stroke="#334155" stroke-width="14" />
    <circle cx="0" cy="0" r="445" fill="none" stroke="#1E293B" stroke-width="8" stroke-dasharray="18 12" />
    <circle cx="0" cy="0" r="395" fill="#1E1610" />
    <!-- Warm Braised Carrots, Olives & Saffron Broth Shapes -->
    <ellipse cx="-140" cy="40" rx="145" ry="52" transform="rotate(-18 -140 40)" fill="#9A3412" />
    <ellipse cx="95" cy="-85" rx="135" ry="48" transform="rotate(25 95 -85)" fill="#78350F" />
    <ellipse cx="40" cy="110" rx="160" ry="65" fill="#451A03" />
    <circle cx="-45" cy="-55" r="95" fill="#3F2E1E" />
  </g>

  <!-- Dark Vignette Overlay -->
  <rect width="1440" height="800" fill="url(#tajineBg)" />
  <rect width="1440" height="800" fill="url(#goldGlow)" />

  <!-- Top Navigation Header -->
  <g transform="translate(102, 28)">
    <!-- Emblem Circle -->
    <circle cx="20" cy="34" r="18" fill="#12141A" stroke="#C8A668" stroke-width="1" stroke-opacity="0.6" />
    <text x="20" y="40" font-family="serif" font-size="16" fill="#DFC28B" text-anchor="middle">✡</text>

    <!-- Brand Title -->
    <text x="50" y="18" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="4">RESTAURANTS</text>
    <text x="50" y="47" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="4">ATLASS</text>
    <text x="50" y="68" font-family="Kanit, sans-serif" font-weight="300" font-size="10.5" fill="#C8A668" letter-spacing="2.8">CUISINE MAROCAINE AUTHENTIQUE</text>

    <!-- Nav Links -->
    <g font-family="Kanit, sans-serif" font-weight="300" font-size="15.5" fill="#CBD5E1" transform="translate(328, 41)">
      <text x="0" y="0" fill="#DFC28B" font-weight="400">Accueil</text>
      <line x1="0" y1="14" x2="54" y2="14" stroke="#C8A668" stroke-width="2" />

      <text x="115" y="-11" text-anchor="middle">Notre</text>
      <text x="115" y="10" text-anchor="middle">Cuisine</text>

      <text x="176" y="0">Menu</text>
      <text x="252" y="0">Galerie</text>

      <text x="362" y="-11" text-anchor="middle">À</text>
      <text x="362" y="10" text-anchor="middle">propos</text>

      <text x="424" y="0">Réservation</text>
      <text x="544" y="0">Contact</text>

      <text x="632" y="0" font-size="13.5" letter-spacing="1.5" fill="#E2E8F0">📞 APPELER</text>
    </g>

    <!-- Top Right Gold CTA Button -->
    <g transform="translate(1058, 6)">
      <rect width="165" height="58" rx="29" fill="url(#goldGrad)" />
      <text x="92" y="26" font-family="Kanit, sans-serif" font-weight="500" font-size="12.5" fill="#0B0C10" letter-spacing="1" text-anchor="middle">RÉSERVER UNE</text>
      <text x="92" y="44" font-family="Kanit, sans-serif" font-weight="500" font-size="12.5" fill="#0B0C10" letter-spacing="1" text-anchor="middle">TABLE</text>
    </g>
  </g>

  <!-- Center Hero Lockup -->
  <g transform="translate(720, 110)" text-anchor="middle">
    <!-- Top Location Pill -->
    <rect x="-220" y="0" width="440" height="36" rx="18" fill="#12141A" fill-opacity="0.75" stroke="#C8A668" stroke-width="1" stroke-opacity="0.4" />
    <text x="0" y="23" font-family="Kanit, sans-serif" font-weight="300" font-size="12.5" fill="#E2E8F0" letter-spacing="2.8">
      <tspan fill="#DFC28B">✡</tspan>  RESTAURANT MAROCAIN D&apos;EXCEPTION  <tspan fill="#DFC28B">● Agadir</tspan>
    </text>

    <!-- 3-Line Editorial Serif Display Heading -->
    <text x="0" y="142" font-family="Georgia, 'Times New Roman', serif" font-size="84" fill="#F8FAFC" letter-spacing="2">L’AUTHENTICITÉ</text>
    <text x="0" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#F8FAFC" letter-spacing="3">MAROCAINE</text>
    <text x="0" y="344" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="72" fill="#D5B475" letter-spacing="3">À VOTRE TABLE</text>

    <!-- Ornamental Divider -->
    <g transform="translate(0, 398)">
      <line x1="-68" y1="0" x2="-16" y2="0" stroke="#C8A668" stroke-opacity="0.45" stroke-width="1" />
      <text x="0" y="6" font-family="serif" font-size="18" fill="#DFC28B">✡</text>
      <line x1="16" y1="0" x2="68" y2="0" stroke="#C8A668" stroke-opacity="0.45" stroke-width="1" />
    </g>

    <!-- Descriptive Paragraph -->
    <g font-family="Kanit, sans-serif" font-weight="200" font-size="22" fill="#CBD5E1">
      <text x="0" y="465">Découvrez les saveurs authentiques du Maroc à travers nos tajines</text>
      <text x="0" y="502">mijotés, couscous traditionnels, rfissa parfumée, poissons frais et</text>
      <text x="0" y="539">spécialités artisanales.</text>
    </g>

    <!-- Bottom Dual Pill CTAs -->
    <g transform="translate(0, 598)">
      <!-- Left Gold Pill -->
      <rect x="-310" y="0" width="312" height="60" rx="30" fill="url(#goldGrad)" />
      <text x="-154" y="36" font-family="Kanit, sans-serif" font-weight="500" font-size="14.5" fill="#0B0C10" letter-spacing="2" text-anchor="middle">🍴  DÉCOUVRIR NOTRE MENU</text>

      <!-- Right Dark Outline Pill -->
      <rect x="20" y="0" width="276" height="60" rx="30" fill="#12141A" fill-opacity="0.75" stroke="#C8A668" stroke-width="1" stroke-opacity="0.45" />
      <text x="158" y="36" font-family="Kanit, sans-serif" font-weight="400" font-size="14.5" fill="#F8FAFC" letter-spacing="2" text-anchor="middle">📅  RÉSERVER UNE TABLE</text>
    </g>
  </g>

  <!-- Green WhatsApp Floating Badge with Gold Notification Dot -->
  <g transform="translate(1352, 708)">
    <circle cx="30" cy="30" r="30" fill="#25D366" />
    <path d="M30,15 C21.7,15 15,21.5 15,29.5 C15,32.2 15.8,34.8 17.2,37 L15.2,44.5 L23,42.5 C25.1,43.6 27.5,44.2 30,44.2 C38.3,44.2 45,37.7 45,29.6 C45,21.5 38.3,15 30,15 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="52" cy="8" r="7" fill="#DFC28B" />
  </g>
</svg>
