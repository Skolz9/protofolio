<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7D2" />
      <stop offset="55%" stop-color="#F3C9A8" />
      <stop offset="100%" stop-color="#DFAB86" />
    </linearGradient>
    <linearGradient id="gloveBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Outer White Frame -->
  <rect width="1440" height="800" fill="#FFFFFF" />

  <!-- Left Column: Soft Off-White Panel -->
  <rect x="130" y="0" width="648" height="800" fill="#F4F6F6" />

  <!-- Left Content: Rendez-Vous Heading & Calendar -->
  <g transform="translate(200, 98)">
    <text x="0" y="0" font-family="Kanit, sans-serif" font-weight="300" font-size="22" fill="#475569">Rendez-Vous</text>

    <g font-family="Kanit, sans-serif" font-weight="300" font-size="52" fill="#1E293B">
      <text x="0" y="84">Reservez dès</text>
      <text x="0" y="154">maintenant votre</text>
      <text x="0" y="224">rendez-vous chez</text>
      <text x="0" y="294">White Dental Clinic</text>
      <text x="0" y="364">Agadir</text>
    </g>

    <!-- Calendar Widget -->
    <g transform="translate(0, 434)">
      <!-- Top Sage Header -->
      <rect x="0" y="0" width="506" height="64" rx="10" fill="#53615A" />
      <text x="253" y="40" font-family="Kanit, sans-serif" font-weight="300" font-size="21" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">SEPTEMBRE 2026</text>
      <path d="M462,32 L478,32 M472,25 L479,32 L472,39" stroke="#FFFFFF" stroke-width="2.2" fill="none" />

      <!-- Days of Week Bar -->
      <rect x="0" y="64" width="506" height="36" fill="#365343" />
      <g font-family="Kanit, sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle" transform="translate(0, 87)">
        <text x="36">LUN</text>
        <text x="108">MAR</text>
        <text x="180">MER</text>
        <text x="253">JEU</text>
        <text x="325">VEN</text>
        <text x="397">SAM</text>
        <text x="470">DIM</text>
      </g>

      <!-- Calendar Grid -->
      <rect x="0" y="100" width="506" height="168" fill="#F8FAFA" />
      <g font-family="Kanit, sans-serif" font-weight="300" font-size="24" fill="#CBD5E1" text-anchor="middle">
        <!-- Row 1 -->
        <text x="36" y="148">31</text>
        <text x="108" y="148">1</text>
        <text x="180" y="148">2</text>
        <text x="253" y="148">3</text>
        <text x="325" y="148">4</text>
        <text x="397" y="148">5</text>
        <text x="470" y="148">6</text>
        <!-- Row 2 -->
        <text x="36" y="230">7</text>
        <text x="108" y="230">8</text>
        <text x="180" y="230">9</text>
        <text x="253" y="230">10</text>
        <text x="325" y="230">11</text>
        <text x="397" y="230">12</text>
        <text x="470" y="230">13</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Dental Appointment Clinical Scene -->
  <g transform="translate(778, 0)">
    <rect width="528" height="800" fill="#E2E8F0" />
    <!-- Dentist White Coat Backdrop -->
    <path d="M0,0 L480,0 L528,220 L528,800 L0,800 Z" fill="#F1F5F9" />

    <!-- Patient Portrait & Dental Care Illustration -->
    <g transform="translate(120, 120)">
      <!-- Blonde Hair -->
      <path d="M60,80 C120,-10 290,-20 380,60 L408,680 L180,680 Z" fill="#C49A6C" />
      <!-- Face Contour -->
      <path d="M40,160 C45,65 155,20 265,45 C355,68 385,180 365,320 C345,450 250,555 145,540 C55,525 25,390 40,160 Z" fill="url(#skinTone)" />
      <!-- Eyebrows & Eyes -->
      <path d="M72,195 C95,182 135,182 158,195" stroke="#6B4423" stroke-width="8" stroke-linecap="round" fill="none" />
      <path d="M210,205 C242,192 292,198 322,218" stroke="#6B4423" stroke-width="8" stroke-linecap="round" fill="none" />
      <ellipse cx="115" cy="228" rx="22" ry="10" fill="#FFFFFF" />
      <circle cx="115" cy="228" r="9" fill="#3B5978" />
      <ellipse cx="255" cy="245" rx="24" ry="10" fill="#FFFFFF" />
      <circle cx="255" cy="245" r="9" fill="#3B5978" />

      <!-- Smile with Braces -->
      <path d="M98,375 C135,360 195,368 222,395 C235,445 195,495 145,490 C100,485 82,425 98,375 Z" fill="#881337" />
      <path d="M108,388 L208,398 L204,424 L106,414 Z" fill="#FFFFFF" />
      <line x1="108" y1="402" x2="206" y2="412" stroke="#94A3B8" stroke-width="3" />

      <!-- Dentist Blue Gloved Hands & Mirror Instrument -->
      <path d="M250,360 C310,315 375,275 415,245 L415,520 C345,515 265,465 250,360 Z" fill="url(#gloveBlue)" />
      <path d="M-85,580 C-25,515 65,495 145,515 C185,555 185,635 135,680 L-85,680 Z" fill="url(#gloveBlue)" />
      <line x1="-20" y1="535" x2="155" y2="445" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
      <circle cx="168" cy="438" r="16" fill="#E2E8F0" stroke="#64748B" stroke-width="3" />
    </g>
  </g>

  <!-- Welcome Toast Pill -->
  <g transform="translate(1070, 622)">
    <rect width="322" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="44" cy="-6" r="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect x="28" y="-18" width="32" height="16" rx="8" fill="#334155" />
    <circle cx="38" cy="-10" r="3" fill="#FFFFFF" />
    <circle cx="50" cy="-10" r="3" fill="#FFFFFF" />
    <text x="182" y="31" font-family="Kanit, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Bienvenue à <tspan font-weight="700" fill="#334155">White Dental Clinic!</tspan></text>
  </g>

  <!-- Green WhatsApp Floating Badge -->
  <g transform="translate(14, 705)">
    <circle cx="30" cy="30" r="30" fill="#25D366" />
    <path d="M30,15 C21.7,15 15,21.5 15,29.5 C15,32.2 15.8,34.8 17.2,37 L15.2,44.5 L23,42.5 C25.1,43.6 27.5,44.2 30,44.2 C38.3,44.2 45,37.7 45,29.6 C45,21.5 38.3,15 30,15 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  </g>
</svg>
