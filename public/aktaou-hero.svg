<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <radialGradient id="blueGlow" cx="30%" cy="62%" r="50%">
      <stop offset="0%" stop-color="#0044FF" stop-opacity="0.42" />
      <stop offset="60%" stop-color="#002288" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#0A2E8C" />
      <stop offset="35%" stop-color="#1D56E8" />
      <stop offset="65%" stop-color="#0E3BB8" />
      <stop offset="100%" stop-color="#071F6B" />
    </linearGradient>
    <linearGradient id="carHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0051FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="800" fill="url(#bgGrad)" />

  <!-- Industrial Backdrop Windows & Garage Shutter -->
  <g opacity="0.45">
    <rect x="170" y="60" width="265" height="440" fill="#181F2E" stroke="#263044" stroke-width="4" />
    <!-- Shutter horizontal lines -->
    <g stroke="#283248" stroke-width="2">
      <line x1="175" y1="90" x2="430" y2="90" />
      <line x1="175" y1="115" x2="430" y2="115" />
      <line x1="175" y1="140" x2="430" y2="140" />
      <line x1="175" y1="165" x2="430" y2="165" />
      <line x1="175" y1="190" x2="430" y2="190" />
      <line x1="175" y1="215" x2="430" y2="215" />
      <line x1="175" y1="240" x2="430" y2="240" />
      <line x1="175" y1="265" x2="430" y2="265" />
    </g>
    <!-- Frosted Industrial Windows -->
    <rect x="665" y="65" width="465" height="450" fill="url(#windowGlow)" stroke="#111827" stroke-width="10" />
    <rect x="1140" y="65" width="300" height="450" fill="url(#windowGlow)" stroke="#111827" stroke-width="10" />
  </g>

  <!-- Ambient Blue Spotlight -->
  <rect width="1440" height="800" fill="url(#blueGlow)" />

  <!-- Ground Floor -->
  <rect x="0" y="640" width="1440" height="160" fill="#060911" />
  <ellipse cx="730" cy="655" rx="600" ry="32" fill="#030509" />

  <!-- Sleek Metallic Blue BMW Coupe Silhouette & Detail -->
  <g transform="translate(80, 265)">
    <!-- Rear & Main Body -->
    <path d="M35,230 C45,180 90,155 170,140 L340,42 C460,-8 650,-6 785,48 L925,132 C1065,148 1195,175 1245,215 C1265,232 1272,265 1265,315 L1235,345 L1140,350 L920,352 L290,352 L60,342 C32,330 22,280 35,230 Z" fill="url(#carBody)" />
    <!-- Roofline & Greenhouse Windows -->
    <path d="M325,135 L455,48 C555,14 685,18 775,58 L890,135 Z" fill="#162032" stroke="#475569" stroke-width="3" />
    <line x1="615" y1="24" x2="595" y2="135" stroke="#0F172A" stroke-width="8" />
    <!-- Shoulder Character Line -->
    <path d="M85,195 L1230,225" stroke="url(#carHighlight)" stroke-width="5" fill="none" />
    <!-- Lower Door Sculpting -->
    <path d="M330,295 L930,302" stroke="#3B82F6" stroke-width="3" stroke-opacity="0.45" fill="none" />
    <!-- Side Mirror -->
    <path d="M835,120 L875,112 L880,136 L835,138 Z" fill="#1D4ED8" stroke="#93C5FD" stroke-width="1.5" />
    <!-- Headlight -->
    <path d="M1175,205 L1252,222 L1235,248 L1165,232 Z" fill="#E0F2FE" opacity="0.9" />
    <!-- Taillight -->
    <path d="M36,195 L88,190 L82,222 L32,222 Z" fill="#DC2626" opacity="0.75" />

    <!-- Rear Wheel -->
    <g transform="translate(235, 315)">
      <circle cx="0" cy="0" r="86" fill="#090D16" />
      <circle cx="0" cy="0" r="72" fill="#111827" stroke="#64748B" stroke-width="4" />
      <circle cx="0" cy="0" r="56" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
      <!-- Spokes -->
      <g stroke="#94A3B8" stroke-width="6">
        <line x1="0" y1="-68" x2="0" y2="68" />
        <line x1="-68" y1="0" x2="68" y2="0" />
        <line x1="-48" y1="-48" x2="48" y2="48" />
        <line x1="-48" y1="48" x2="48" y2="-48" />
      </g>
      <circle cx="0" cy="0" r="16" fill="#1E3A8A" stroke="#CBD5E1" stroke-width="3" />
    </g>

    <!-- Front Wheel -->
    <g transform="translate(1055, 315)">
      <circle cx="0" cy="0" r="86" fill="#090D16" />
      <circle cx="0" cy="0" r="72" fill="#111827" stroke="#64748B" stroke-width="4" />
      <circle cx="0" cy="0" r="56" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
      <g stroke="#94A3B8" stroke-width="6">
        <line x1="0" y1="-68" x2="0" y2="68" />
        <line x1="-68" y1="0" x2="68" y2="0" />
        <line x1="-48" y1="-48" x2="48" y2="48" />
        <line x1="-48" y1="48" x2="48" y2="-48" />
      </g>
      <circle cx="0" cy="0" r="16" fill="#1E3A8A" stroke="#CBD5E1" stroke-width="3" />
    </g>
  </g>

  <!-- Dark Left Vignette Scrim for Text Legibility -->
  <rect x="0" y="0" width="900" height="800" fill="url(#bgGrad)" opacity="0.45" />

  <!-- Top Navigation Bar -->
  <g transform="translate(115, 28)">
    <text x="0" y="22" font-family="Kanit, Impact, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="1.5">AKTAOU</text>
    <text x="86" y="22" font-family="Kanit, Impact, sans-serif" font-weight="900" font-size="24" fill="#0066FF" letter-spacing="1.5">CAR</text>

    <g font-family="Kanit, sans-serif" font-size="15" font-weight="400" fill="#E2E8F0" transform="translate(380, 20)">
      <text x="0" y="0">Home</text>
      <text x="68" y="0">Fleet</text>
      <text x="130" y="0">Services</text>
      <text x="215" y="0">About</text>
      <text x="285" y="0">Blog</text>
      <text x="342" y="0">Contact</text>
    </g>

    <!-- EN Pill -->
    <rect x="1048" y="0" width="44" height="32" rx="16" fill="none" stroke="#475569" stroke-width="1.5" />
    <text x="1070" y="21" font-family="Kanit, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">EN</text>

    <!-- Reserve Button -->
    <rect x="1108" y="-3" width="96" height="38" rx="19" fill="url(#btnBlue)" />
    <text x="1156" y="21" font-family="Kanit, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Reserve</text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(115, 165)">
    <!-- Location Pill -->
    <rect x="0" y="0" width="316" height="36" rx="18" fill="#1E293B" fill-opacity="0.7" stroke="#475569" stroke-width="1" />
    <circle cx="20" cy="18" r="4.5" fill="#0066FF" />
    <text x="34" y="23" font-family="Kanit, sans-serif" font-size="12.5" font-weight="600" fill="#F8FAFC" letter-spacing="2.5">TÉTOUAN · TANGIER · MOROCCO</text>

    <!-- Main Display Heading -->
    <text x="0" y="135" font-family="Kanit, Impact, sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" letter-spacing="-1">Premium Car Rental in</text>
    <text x="0" y="215" font-family="Kanit, Impact, sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" letter-spacing="-1">Tetouan</text>

    <!-- Subtitle -->
    <text x="0" y="272" font-family="Kanit, sans-serif" font-weight="300" font-size="22" fill="#CBD5E1">Reliable. Comfortable. Available 24/7 — with airport delivery across</text>
    <text x="0" y="306" font-family="Kanit, sans-serif" font-weight="300" font-size="22" fill="#CBD5E1">northern Morocco.</text>

    <!-- 5.0 Google Rating -->
    <g transform="translate(0, 345)">
      <text x="0" y="16" font-family="sans-serif" font-size="18" fill="#0066FF" letter-spacing="3">★★★★★</text>
      <text x="105" y="16" font-family="Kanit, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">5.0</text>
      <text x="138" y="16" font-family="Kanit, sans-serif" font-weight="300" font-size="15" fill="#94A3B8">· 7 Google reviews</text>
    </g>

    <!-- CTA Buttons -->
    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="176" height="54" rx="27" fill="url(#btnBlue)" />
      <text x="88" y="33" font-family="Kanit, sans-serif" font-weight="600" font-size="15" fill="#FFFFFF" text-anchor="middle">Reserve Now  →</text>

      <rect x="194" y="0" width="192" height="54" rx="27" fill="#1E293B" fill-opacity="0.65" stroke="#475569" stroke-width="1.5" />
      <text x="290" y="33" font-family="Kanit, sans-serif" font-weight="600" font-size="15" fill="#FFFFFF" text-anchor="middle">Chat on WhatsApp</text>
    </g>
  </g>

  <!-- Scroll Indicator -->
  <text x="720" y="732" font-family="Kanit, sans-serif" font-size="12" font-weight="400" fill="#94A3B8" letter-spacing="3" text-anchor="middle">SCROLL TO BEGIN THE DRIVE</text>
  <path d="M714,748 L720,754 L726,748" stroke="#94A3B8" stroke-width="1.5" fill="none" />

  <!-- Green WhatsApp Floating Badge -->
  <g transform="translate(1360, 715)">
    <circle cx="28" cy="28" r="28" fill="#25D366" />
    <path d="M28,14 C20.3,14 14,20.1 14,27.6 C14,30.1 14.7,32.5 16,34.5 L14.2,41.5 L21.5,39.7 C23.4,40.7 25.7,41.3 28,41.3 C35.7,41.3 42,35.2 42,27.7 C42,20.1 35.7,14 28,14 Z" fill="none" stroke="#070B14" stroke-width="2.5" />
  </g>
</svg>
