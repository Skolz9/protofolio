<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A668" />
      <stop offset="50%" stop-color="#DFC28B" />
      <stop offset="100%" stop-color="#B89352" />
    </linearGradient>
    <linearGradient id="cardFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101318" stop-opacity="0" />
      <stop offset="75%" stop-color="#101318" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#101318" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="1440" height="800" fill="#08090C" />

  <!-- Top Navigation Header -->
  <g transform="translate(102, 24)">
    <circle cx="20" cy="34" r="18" fill="#12141A" stroke="#C8A668" stroke-width="1" stroke-opacity="0.6" />
    <text x="20" y="40" font-family="serif" font-size="16" fill="#DFC28B" text-anchor="middle">✡</text>

    <text x="50" y="18" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="4">RESTAURANTS</text>
    <text x="50" y="47" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="4">ATLASS</text>
    <text x="50" y="68" font-family="Kanit, sans-serif" font-weight="300" font-size="10.5" fill="#C8A668" letter-spacing="2.8">CUISINE MAROCAINE AUTHENTIQUE</text>

    <g font-family="Kanit, sans-serif" font-weight="300" font-size="15.5" fill="#CBD5E1" transform="translate(328, 41)">
      <text x="0" y="0">Accueil</text>
      <text x="115" y="-11" fill="#DFC28B" font-weight="400" text-anchor="middle">Notre</text>
      <text x="115" y="10" fill="#DFC28B" font-weight="400" text-anchor="middle">Cuisine</text>
      <line x1="85" y1="22" x2="145" y2="22" stroke="#C8A668" stroke-width="2" />
      <text x="176" y="0">Menu</text>
      <text x="252" y="0">Galerie</text>
      <text x="362" y="-11" text-anchor="middle">À</text>
      <text x="362" y="10" text-anchor="middle">propos</text>
      <text x="424" y="0">Réservation</text>
      <text x="544" y="0">Contact</text>
      <text x="632" y="0" font-size="13.5" letter-spacing="1.5" fill="#E2E8F0">📞 APPELER</text>
    </g>

    <g transform="translate(1058, 6)">
      <rect width="165" height="58" rx="29" fill="url(#goldGrad2)" />
      <text x="92" y="26" font-family="Kanit, sans-serif" font-weight="500" font-size="12.5" fill="#0B0C10" letter-spacing="1" text-anchor="middle">RÉSERVER UNE</text>
      <text x="92" y="44" font-family="Kanit, sans-serif" font-weight="500" font-size="12.5" fill="#0B0C10" letter-spacing="1" text-anchor="middle">TABLE</text>
    </g>
  </g>
  <line x1="0" y1="112" x2="1440" y2="112" stroke="#1E293B" stroke-width="1" />

  <!-- 4 Culinary Category Cards -->
  <!-- Card 1: TAJINES MAROCAINS -->
  <g transform="translate(104, 180)">
    <rect width="280" height="504" rx="18" fill="#101318" stroke="#1E293B" stroke-width="1.2" />
    <!-- Top Food Photo Area -->
    <g>
      <rect x="2" y="2" width="276" height="235" rx="16" fill="#181C24" />
      <circle cx="140" cy="118" r="108" fill="#1E293B" stroke="#64748B" stroke-width="6" />
      <circle cx="140" cy="118" r="88" fill="#451A03" />
      <ellipse cx="105" cy="120" rx="38" ry="16" transform="rotate(-15 105 120)" fill="#EA580C" />
      <ellipse cx="155" cy="95" rx="35" ry="25" fill="#78350F" />
      <ellipse cx="155" cy="145" rx="40" ry="18" fill="#65A30D" opacity="0.75" />
      <rect x="2" y="135" width="276" height="105" fill="url(#cardFade)" />
    </g>
    <!-- Pill -->
    <rect x="190" y="16" width="76" height="28" rx="14" fill="#0B0C10" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="228" y="34" font-family="Kanit, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">4 recettes</text>

    <!-- Card Text -->
    <text x="20" y="278" font-family="Kanit, sans-serif" font-weight="300" font-size="11.5" fill="#C8A668" letter-spacing="2">MIJOTÉS AU FEU DE BRAISE</text>
    <text x="20" y="310" font-family="Georgia, serif" font-size="20" fill="#FFFFFF" letter-spacing="0.5">TAJINES MAROCAINS</text>
    <g font-family="Kanit, sans-serif" font-weight="200" font-size="13.5" fill="#94A3B8">
      <text x="20" y="345">Des tajines mijotés lentement selon les</text>
      <text x="20" y="368">traditions marocaines ancestrales, riches</text>
      <text x="20" y="391">en épices nobles, safran pur et saveurs...</text>
    </g>
    <line x1="20" y1="448" x2="260" y2="448" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="476" font-family="Kanit, sans-serif" font-weight="400" font-size="13.5" fill="#F8FAFC">Voir la sélection  <tspan fill="#C8A668">→</tspan></text>
    <text x="260" y="476" font-family="Kanit, sans-serif" font-weight="200" font-size="12.5" fill="#94A3B8" text-anchor="end" text-decoration="underline">En savoir plus</text>
  </g>

  <!-- Card 2: COUSCOUS MAROCAIN (Gold Highlighted Card) -->
  <g transform="translate(418, 180)">
    <rect width="280" height="504" rx="18" fill="#101318" stroke="#C8A668" stroke-width="1.5" />
    <g>
      <rect x="2" y="2" width="276" height="235" rx="16" fill="#27190E" />
      <circle cx="65" cy="120" r="82" fill="#9A3412" stroke="#CBD5E1" stroke-width="5" />
      <circle cx="220" cy="115" r="78" fill="#B45309" stroke="#CBD5E1" stroke-width="5" />
      <circle cx="72" cy="112" r="14" fill="#15803D" />
      <circle cx="210" cy="128" r="14" fill="#15803D" />
      <rect x="2" y="135" width="276" height="105" fill="url(#cardFade)" />
    </g>
    <rect x="190" y="16" width="76" height="28" rx="14" fill="#0B0C10" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="228" y="34" font-family="Kanit, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">4 recettes</text>

    <text x="20" y="278" font-family="Kanit, sans-serif" font-weight="300" font-size="11.5" fill="#C8A668" letter-spacing="2">ROULÉ MAIN AUX 7 LÉGUMES</text>
    <text x="20" y="310" font-family="Georgia, serif" font-size="20" fill="#DFC28B" letter-spacing="0.5">COUSCOUS MAROCAIN</text>
    <g font-family="Kanit, sans-serif" font-weight="200" font-size="13.5" fill="#94A3B8">
      <text x="20" y="345">Un couscous traditionnel généreux</text>
      <text x="20" y="368">accompagné de légumes du terroir et de</text>
      <text x="20" y="391">viandes soigneusement sélectionnées e...</text>
    </g>
    <line x1="20" y1="448" x2="260" y2="448" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="476" font-family="Kanit, sans-serif" font-weight="400" font-size="13.5" fill="#F8FAFC">Voir la sélection  <tspan fill="#C8A668">→</tspan></text>
    <text x="260" y="476" font-family="Kanit, sans-serif" font-weight="200" font-size="12.5" fill="#94A3B8" text-anchor="end" text-decoration="underline">En savoir plus</text>
  </g>

  <!-- Card 3: RFISSA TRADITIONNELLE -->
  <g transform="translate(732, 180)">
    <rect width="280" height="504" rx="18" fill="#101318" stroke="#1E293B" stroke-width="1.2" />
    <g>
      <rect x="2" y="2" width="276" height="235" rx="16" fill="#16181E" />
      <path d="M10,165 L250,210 L270,135 L40,95 Z" fill="#D6B38E" />
      <ellipse cx="165" cy="145" rx="75" ry="28" transform="rotate(22 165 145)" fill="#451A03" />
      <circle cx="58" cy="135" r="24" fill="#DC2626" />
      <circle cx="92" cy="145" r="24" fill="#DC2626" />
      <rect x="2" y="135" width="276" height="105" fill="url(#cardFade)" />
    </g>
    <rect x="196" y="16" width="70" height="28" rx="14" fill="#0B0C10" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="231" y="34" font-family="Kanit, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">1 recette</text>

    <text x="20" y="278" font-family="Kanit, sans-serif" font-weight="300" font-size="11.5" fill="#C8A668" letter-spacing="2">HÉRITAGE CULINAIRE SÉCULAIRE</text>
    <text x="20" y="310" font-family="Georgia, serif" font-size="20" fill="#FFFFFF" letter-spacing="0.5">RFISSA TRADITIONNELLE</text>
    <g font-family="Kanit, sans-serif" font-weight="200" font-size="13.5" fill="#94A3B8">
      <text x="20" y="345">Une spécialité marocaine authentique à</text>
      <text x="20" y="368">base de fines feuilles de msemen,</text>
      <text x="20" y="391">lentilles, poulet fermier et mélange...</text>
    </g>
    <line x1="20" y1="448" x2="260" y2="448" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="476" font-family="Kanit, sans-serif" font-weight="400" font-size="13.5" fill="#F8FAFC">Voir la sélection  <tspan fill="#C8A668">→</tspan></text>
    <text x="260" y="476" font-family="Kanit, sans-serif" font-weight="200" font-size="12.5" fill="#94A3B8" text-anchor="end" text-decoration="underline">En savoir plus</text>
  </g>

  <!-- Card 4: POISSONS & FRUITS DE MER -->
  <g transform="translate(1046, 180)">
    <rect width="280" height="504" rx="18" fill="#101318" stroke="#1E293B" stroke-width="1.2" />
    <g>
      <rect x="2" y="2" width="276" height="235" rx="16" fill="#1E242B" />
      <ellipse cx="140" cy="135" rx="125" ry="62" fill="#0F1318" />
      <path d="M55,112 C95,62 185,68 218,95 L205,132 L52,126 Z" fill="#EA580C" />
      <ellipse cx="135" cy="142" rx="68" ry="18" fill="#15803D" />
      <rect x="2" y="135" width="276" height="105" fill="url(#cardFade)" />
    </g>
    <rect x="190" y="16" width="76" height="28" rx="14" fill="#0B0C10" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="228" y="34" font-family="Kanit, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">3 recettes</text>

    <text x="20" y="278" font-family="Kanit, sans-serif" font-weight="300" font-size="11.5" fill="#C8A668" letter-spacing="2">PÊCHE LOCALE DU JOUR</text>
    <text x="20" y="310" font-family="Georgia, serif" font-size="20" fill="#FFFFFF" letter-spacing="0.5">POISSONS &amp; FRUITS DE</text>
    <text x="20" y="342" font-family="Georgia, serif" font-size="20" fill="#FFFFFF" letter-spacing="0.5">MER</text>
    <g font-family="Kanit, sans-serif" font-weight="200" font-size="13.5" fill="#94A3B8">
      <text x="20" y="378">Poissons frais de l&apos;Atlantique sublimés à la</text>
      <text x="20" y="401">chermoula parfumée à la coriandre</text>
      <text x="20" y="424">fraîche, ail confit, cumin et citron pressé.</text>
    </g>
    <line x1="20" y1="448" x2="260" y2="448" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="476" font-family="Kanit, sans-serif" font-weight="400" font-size="13.5" fill="#F8FAFC">Voir la sélection  <tspan fill="#C8A668">→</tspan></text>
    <text x="260" y="476" font-family="Kanit, sans-serif" font-weight="200" font-size="12.5" fill="#94A3B8" text-anchor="end" text-decoration="underline">En savoir plus</text>
  </g>

  <!-- Green WhatsApp Floating Badge -->
  <g transform="translate(1352, 708)">
    <circle cx="30" cy="30" r="30" fill="#25D366" />
    <path d="M30,15 C21.7,15 15,21.5 15,29.5 C15,32.2 15.8,34.8 17.2,37 L15.2,44.5 L23,42.5 C25.1,43.6 27.5,44.2 30,44.2 C38.3,44.2 45,37.7 45,29.6 C45,21.5 38.3,15 30,15 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="52" cy="8" r="7" fill="#DFC28B" />
  </g>
</svg>
